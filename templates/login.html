<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • Shorts</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-bg"><form class="login-card" method="post"><div class="brand centered"><span class="brand-mark">S</span><div><b>SHORTS</b><small>OS ACHADINHOS</small></div></div><span class="eyebrow">ACESSO PRIVADO</span><h1>Entre no seu estúdio</h1><label>Usuário<input name="username" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="primary full">Entrar no painel</button>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p class="flash {{c}}">{{m}}</p>{% endfor %}{% endwith %}<small class="muted">Altere a senha inicial antes de publicar.</small></form></body></html>
